name=NW_Core
version=0.0.0
author=Andrew D. Wickert and Bobby Schulz; Northern Widget
maintainer=Northern Widget
sentence=Shared foundation for Northern Widget sensor libraries: the NW-Device-Specification Schema 1 device protocol and a fixed-capacity readings store with statistics.
paragraph=NW_Device speaks the Schema 1 register map (Page 0 identity and version gates, the Block 0 trigger/ready/counter handshake, batches, faults); NW_Readings holds a measurement's readings without the heap and computes mean, standard deviation, standard error, and median; NW_Fault decodes the status and latched-fault bytes. Unversioned during the 2026 overhaul.
category=Sensors
